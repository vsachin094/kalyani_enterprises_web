{% extends "base.html" %}

{% block content %}
<section class="error-section py-5" style="margin-top: 80px; min-height: 60vh;">
    <div class="container text-center">
        <h1 style="font-size: 6rem; color: #dc3545;">500</h1>
        <h2>Internal Server Error</h2>
        <p class="lead">{{ message or "Something went wrong. Please try again later." }}</p>
        <a href="/" class="btn btn-primary btn-lg mt-3">
            <i class="bi bi-house-fill"></i> Go Home
        </a>
    </div>
</section>
{% endblock %}
