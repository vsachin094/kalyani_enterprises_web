# Nginx configuration for Kalyani Enterprises
# Place in /etc/nginx/sites-available/kalyani-enterprises

server {
    listen 80;
    server_name kalyanienterprises.com www.kalyanienterprises.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kalyanienterprises.com www.kalyanienterprises.com;

    # SSL certificates (use certbot to generate)
    ssl_certificate /etc/letsencrypt/live/kalyanienterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kalyanienterprises.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # FastAPI serves the built React SPA and API from one container.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
