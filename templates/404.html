{% extends "base.html" %}

{% block content %}
<section class="error-section py-5" style="margin-top: 80px; min-height: 60vh;">
    <div class="container text-center">
        <h1 style="font-size: 6rem; color: var(--brand-1);">404</h1>
        <h2>Page Not Found</h2>
        <p class="lead">{{ message or "The page you're looking for doesn't exist." }}</p>
        <a href="/" class="btn btn-primary btn-lg mt-3">
            <i class="bi bi-house-fill"></i> Go Home
        </a>
    </div>
</section>
{% endblock %}
